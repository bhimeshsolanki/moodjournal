spring.application.name=moodjournal
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/moodjournal
spring.datasource.username=<USERNAME>
# Remove hardcoded password and use environment variables or a secure vault in production
spring.datasource.password=<PASSWORD>
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Remove hardcoded API key and use environment variables or a secure vault in production
huggingface.api.key=<API_KEY>
# huggingface.api.url=https://api-inference.huggingface.co/models/distilbert-base-uncased-finetuned-sst-2-english
huggingface.api.url=https://router.huggingface.co/hf-inference/models/distilbert/distilbert-base-uncased-finetuned-sst-2-english